[package]
name = "xinux-module-manager"
version = "0.0.1"
edition = "2024"
default-run = "xinux-module-manager"
authors = [
  "Sokhibjon Orzikulov <sakhib@orzklv.uz>",
  "Victor Fuentes <vlinkz@snowflakeos.org>",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
relm4 = { version = "0.11.0", features = ["libadwaita", "macros", "gnome_50"] }
relm4-components = {version = "0.11.0",  features = ["libadwaita"] }
vte = { package = "vte4", version = "0.10.0" }

nix-data-xinux = "0.0.6"
anyhow = "1.0.102"
log = "0.4.30"
pretty_env_logger = "0.5.0"
walkdir = "2.5"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
# ijson = "0.1"

nix-editor = "0.3.0"
nixpkgs-fmt = "1.3"
tracker = "0.2.2"
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }

[workspace]
members = [".", "smm-helper"]
default-members = [".", "smm-helper"]
